<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | TutorFlow Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script>
        // 👑 CRITICAL ANTI-FLICKER ENGINE SYNCHRONIZATION
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        /* --- DYNAMIC COHESIVE SYSTEM TOKENS --- */
        :root, [data-bs-theme="light"], [data-theme="light"] {
            --bg-body: radial-gradient(circle at top right, #e0e7ff, #f3f4f6);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: rgba(255, 255, 255, 0.6);
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --dropdown-bg: #ffffff;
            --select-icon: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%236366f1' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
        }

        [data-bs-theme="dark"], [data-theme="dark"] {
            --bg-body: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            --card-bg: rgba(20, 20, 25, 0.65);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 15, 20, 0.6);
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --dropdown-bg: #141416;
            --select-icon: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23a855f7' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
        }

        body {
            background: var(--bg-body) no-repeat fixed;
            color: var(--text-main);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        /* --- MODERN EDIT CARD --- */
        .edit-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06) !important;
        }

        /* --- FORM ELEMENTS --- */
        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-left: 5px;
        }

        .input-group-glass {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 0 15px;
            transition: 0.3s ease;
        }

        .input-group-glass:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
            background: var(--dropdown-bg);
        }

        .input-group-glass i {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .glass-control {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 12px 10px !important;
            color: var(--text-main) !important;
            font-weight: 600;
        }

        /* Select arrow customization fallback */
        .select-glass {
            appearance: none;
            background-image: var(--select-icon);
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 12px;
            padding-right: 35px !important;
        }

        .glass-control option {
            background: var(--dropdown-bg);
            color: var(--text-main);
        }

        /* --- BUTTONS --- */
        .btn-premium-save {
            background: var(--primary-grad);
            border: none;
            color: white;
            border-radius: 18px;
            padding: 14px;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
        }

        .btn-premium-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-premium-cancel {
            border-radius: 18px;
            padding: 14px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: 0.3s;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }
        
        .btn-premium-cancel:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-main);
        }
        [data-bs-theme="dark"] .btn-premium-cancel:hover, [data-theme="dark"] .btn-premium-cancel:hover {
            background: rgba(255,255,255,0.05);
        }

        .section-divider-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: #a855f7;
            letter-spacing: 1px;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
            margin-bottom: 15px;
        }

        /* 👑 POSITIONING FOR TOP RIGHT GEAR OPTION */
        .settings-top-right {
            position: absolute !important;
            top: 25px !important;
            right: 25px !important;
            z-index: 1060;
        }

        .btn-settings-gear {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main) !important;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-settings-gear:hover, .btn-settings-gear:focus {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(45deg) scale(1.05);
        }

        .dropdown-menu-glass {
            background: var(--dropdown-bg) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 16px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 8px;
            min-width: 185px;
        }

        .dropdown-item-glass {
            color: var(--text-main) !important;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .dropdown-item-glass:hover {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%) !important;
            color: white !important;
        }

        @media (max-width: 768px) {
            .settings-top-right {
                top: 15px !important;
                right: 15px !important;
            }
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 position-relative">
                
                <div class="settings-top-right dropdown">
                    <button class="btn btn-settings-gear" type="button" id="settingsMenuButton" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Settings Menu">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-glass shadow-lg" aria-labelledby="settingsMenuButton">
                        <li>
                            <a class="dropdown-item dropdown-item-glass" href="/student-profile">
                                <i class="bi bi-person-bounding-box text-warning"></i> View Profile
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item dropdown-item-glass" href="/edit-profile">
                                <i class="bi bi-pencil-square text-primary"></i> Edit Profile
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item dropdown-item-glass" href="#" id="theme-toggle-dropdown">
                                <i class="bi bi-palette-fill text-info"></i> Change Theme
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item dropdown-item-glass" href="/contact">
                                <i class="bi bi-headset text-success"></i> Help & Support
                            </a>
                        </li>
                        <li><hr class="dropdown-divider" style="opacity: 0.1; border-color: var(--border-color);"></li>
                        <li>
                            <a class="dropdown-item dropdown-item-glass text-danger" href="/logout" onclick="return confirm('Logout?')">
                                <i class="bi bi-box-arrow-right"></i> Sign Out
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="card edit-card shadow p-4 p-md-5 border-0">
                    
                    <div class="d-flex flex-column align-items-center text-center mb-5">
                        <div class="avatar-circle">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h3 class="fw-bold m-0" style="letter-spacing:-0.02em;">Edit My Profile</h3>
                        <p class="small text-muted mb-0">Keep your information accurate and up to date</p>
                    </div>

                    <form method="POST">
                        
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group-glass">
                                <i class="bi bi-person-fill"></i>
                                <input type="text" name="name" class="form-control glass-control" value="{{ student.name }}" required placeholder="Enter full name">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group-glass">
                                <i class="bi bi-envelope-fill"></i>
                                <input type="email" name="email" class="form-control glass-control" value="{{ student.email }}" required placeholder="Enter email address">
                            </div>
                        </div>

                        <div class="row mb-3 g-3">
                            <div class="col-6">
                                <label class="form-label">Grade / Class</label>
                                <div class="input-group-glass">
                                    <i class="bi bi-mortarboard-fill"></i>
                                    <select name="grade" class="form-select glass-control select-glass" required>
                                        <option value="Class 1" {% if student.grade == 'Class 1' %}selected{% endif %}>Class 1</option>
                                        <option value="Class 2" {% if student.grade == 'Class 2' %}selected{% endif %}>Class 2</option>
                                        <option value="Class 3" {% if student.grade == 'Class 3' %}selected{% endif %}>Class 3</option>
                                        <option value="Class 4" {% if student.grade == 'Class 4' %}selected{% endif %}>Class 4</option>
                                        <option value="Class 5" {% if student.grade == 'Class 5' %}selected{% endif %}>Class 5</option>
                                        <option value="Class 6" {% if student.grade == 'Class 6' %}selected{% endif %}>Class 6</option>
                                        <option value="Class 7" {% if student.grade == 'Class 7' %}selected{% endif %}>Class 7</option>
                                        <option value="Class 8" {% if student.grade == 'Class 8' %}selected{% endif %}>Class 8</option>
                                        <option value="Class 9" {% if student.grade == 'Class 9' %}selected{% endif %}>Class 9</option>
                                        <option value="Class 10" {% if student.grade == 'Class 10' %}selected{% endif %}>Class 10</option>
                                        <option value="Class 11" {% if student.grade == 'Class 11' %}selected{% endif %}>Class 11</option>
                                        <option value="Class 12" {% if student.grade == 'Class 12' %}selected{% endif %}>Class 12</option>
                                        <option value="College/UG/PG" {% if student.grade == 'College/UG/PG' or student.grade == 'College' %}selected{% endif %}>College / Degree</option>
                                        <option value="Competitive Exams" {% if student.grade == 'Competitive Exams' %}selected{% endif %}>Competitive Exams</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-6">
                                <label class="form-label">Area (Bhopal)</label>
                                <div class="input-group-glass">
                                    <i class="bi bi-geo-alt-fill"></i>
                                    <select name="area" class="form-select glass-control select-glass" required>
                                        <option value="MP Nagar" {% if student.area == 'MP Nagar' %}selected{% endif %}>MP Nagar</option>
                                        <option value="Indrapuri" {% if student.area == 'Indrapuri' %}selected{% endif %}>Indrapuri</option>
                                        <option value="Arera Colony" {% if student.area == 'Arera Colony' %}selected{% endif %}>Arera Colony</option>
                                        <option value="Idgah Hills" {% if student.area == 'Idgah Hills' %}selected{% endif %}>Idgah Hills</option>
                                        <option value="Gulmohar" {% if student.area == 'Gulmohar' or student.area == 'Gulmohar' %}selected{% endif %}>Gulmohar</option>
                                        <option value="Kolar Road" {% if student.area == 'Kolar Road' %}selected{% endif %}>Kolar Road</option>
                                        <option value="New Market" {% if student.area == 'New Market' %}selected{% endif %}>New Market</option>
                                        <option value="Ayodhya Bypass" {% if student.area == 'Ayodhya Bypass' %}selected{% endif %}>Ayodhya Bypass</option>
                                        <option value="Other Area" {% if student.area == 'Other Area' %}selected{% endif %}>Other Area</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mt-5 mb-4 pt-3 border-top border-light d-flex align-items-center" style="opacity:0.85;">
                            <span class="section-divider-title text-uppercase me-2"><i class="bi bi-shield-lock-fill me-1"></i> Security Workspace</span>
                            <div class="flex-grow-1 border-bottom" style="opacity: 0.15; border-color:var(--border-color)"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <div class="input-group-glass">
                                <i class="bi bi-key-fill"></i>
                                <input type="password" name="new_password" class="form-control glass-control" placeholder="Leave blank to keep current">
                            </div>
                            <div class="form-text small text-muted ms-2" style="font-size: 0.7rem;">Only fill this if you want to change your password system credentials.</div>
                        </div>

                        <div class="row g-3 mt-4">
                            <div class="col-8">
                                <button type="submit" class="btn btn-premium-save w-100 shadow-sm">
                                    <i class="bi bi-cloud-arrow-up-fill me-2"></i>Save Changes
                                </button>
                            </div>
                            <div class="col-4">
                                <a href="/student-profile" class="btn btn-premium-cancel w-100">Cancel</a>
                            </div>
                        </div>

                    </form>
                </div>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">
                        Need assistance? <a href="/contact" class="text-decoration-none fw-bold" style="color: #6366f1;">Contact Support Hub</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const themeToggleDropdown = document.getElementById('theme-toggle-dropdown');
        const htmlElement = document.documentElement;

        // Initialize saved matrix choice channels 
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        htmlElement.setAttribute('data-theme', savedTheme);

        themeToggleDropdown.addEventListener('click', (e) => {
            e.preventDefault(); 
            let theme = htmlElement.getAttribute('data-theme') || htmlElement.getAttribute('data-bs-theme');
            let newTheme = (theme === 'light') ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-bs-theme', newTheme);
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
