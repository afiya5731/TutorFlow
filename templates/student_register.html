{% extends 'base.html' %}

{% block title %}Student Registration | TutorFlow Premium{% endblock %}

{% block extra_css %}
    <style>
        :root[data-bs-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --text-main: #0f172a;
            --text-muted: #475569;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(241, 245, 249, 1);
            --input-bg: #ffffff;
            --card-sub: #ffffff;
            --shadow-glow: rgba(99, 102, 241, 0.05);
            --link-color: #6366f1;
        }

        :root[data-bs-theme="dark"] {
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b 0%, #09090b 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 15, 20, 0.6);
            --card-sub: #141416;
            --shadow-glow: rgba(168, 85, 247, 0.15);
            --link-color: #a855f7;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            transition: all 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Unified Glass Navbar */
        .glass-nav {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 0;
        }

        .text-main {
            color: var(--text-main) !important;
        }

        .theme-toggle-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 100px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-nav-accent {
            border: 1px solid #06b6d4 !important;
            background: rgba(6, 182, 212, 0.05) !important;
            color: #06b6d4 !important;
            font-weight: 600;
            border-radius: 10px;
        }

        .modal-content-glass {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border) !important;
            border-radius: 16px !important;
        }

        /* Glassmorphic Registration Card */
        .glass-reg-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }

        .glass-reg-card:hover {
            box-shadow: 0 25px 50px var(--shadow-glow);
        }

        .input-glass {
            background: var(--input-bg) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-main) !important;
            padding: 12px 14px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .input-glass:focus {
            border-color: var(--link-color);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .select-glass {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23a855f7' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 12px;
        }

        .input-group-text-glass {
            background: var(--glass-border);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 12px 0 0 12px;
            font-weight: 600;
            padding: 0 16px;
        }

        .btn-glow-register {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: white !important;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
            transition: all 0.2s ease;
        }

        .btn-glow-register:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }

        .icon-header-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.25);
        }

        .brand-accent {
            color: var(--link-color);
            font-weight: 700;
        }
    </style>
{% endblock %}

{% block content %}

    <div class="container my-5 flex-grow-1 d-flex flex-column justify-content-center">
        <div class="row justify-content-center px-2">
            <div class="col-11 col-md-9 col-lg-7 col-xl-6">
                
                <div class="glass-reg-card shadow-sm">
                    <div class="icon-header-circle">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>
                    
                    <h3 class="fw-bold text-center mb-1" style="letter-spacing:-0.02em;">Student Registration</h3>
                    <p class="text-center text-muted small mb-4">Find the most elite verified tutors in Bhopal</p>
                    
                    <form action="/student-register" method="POST">
                        <div class="row g-3 text-start">
                            <div class="col-md-12">
                                <label class="small fw-bold mb-2 text-main">Student Name</label>
                                <input type="text" name="name" class="form-control input-glass" placeholder="Enter your full name" required>
                            </div>

                            <div class="col-md-12">
                                <label class="small fw-bold mb-2 text-main">Email </label>
                                <input type="email" name="email" class="form-control input-glass" value="" placeholder="email@example.com" required>
                            </div>

                            <div class="col-md-12">
                                <label class="small fw-bold mb-2 text-main">WhatsApp Mobile Contact </label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-glass">+91</span>
                                    <input type="text" name="phone" class="form-control input-glass" style="border-radius: 0 12px 12px 0 !important;" placeholder="9876543210" pattern="[0-9]{10}" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="small fw-bold mb-2 text-main">Grade</label>
                                <select name="grade" class="form-select input-glass select-glass" required>
                                        <option value="" selected disabled>Select Class</option>
                                        
                                        <option value="Class 1">Class 1</option>
                                        <option value="Class 2">Class 2</option>
                                        <option value="Class 3">Class 3</option>
                                        <option value="Class 4">Class 4</option>
                                        <option value="Class 5">Class 5</option>
                                        
                                        <option value="Class 6">Class 6</option>
                                        <option value="Class 7">Class 7</option>
                                        <option value="Class 8">Class 8</option>
                                        
                                        <option value="Class 9">Class 9</option>
                                        <option value="Class 10">Class 10</option>
                                        
                                        <option value="Class 11">Class 11</option>
                                        <option value="Class 12">Class 12</option>
                                        
                                        <option value="College/UG/PG">College / University Degree</option>
                                        <option value="Competitive Exams">Competitive Exams (JEE / NEET / GATE)</option>
                                    </select>
                            </div>

                            <div class="col-md-6">
                                <label class="small fw-bold mb-2 text-main">Location </label>
                                <select name="area" class="form-select input-glass select-glass" required>
                                    <option value="" selected disabled>📍 Select Your Area</option>
                                    <option value="MP Nagar">MP Nagar</option>
                                    <option value="Indrapuri">Indrapuri</option>
                                    <option value="Arera Colony">Arera Colony</option>
                                    <option value="Koh e Fiza">Koh e fiza</option>
                                    <option value="Lal Ghati">Lal Ghati</option>
                                    <option value="Idgah Hills">Idgah Hills</option>
                                    <option value="Gulmohar">Gulmohar</option>
                                    <option value="Kolar Road">Kolar Road</option>
                                    <option value="New Market">New Market</option>
                                    <option value="Ayodhya Bypass">Ayodhya Bypass</option>
                                    <option value="Other Area">Other Area in Bhopal</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="small fw-bold mb-2 text-main">Instructor Link ID (Provided by Teacher)</label>
                                <input type="text" name="teacher_id" class="form-control input-glass" placeholder="Enter teacher code (e.g. 1)" required>
                            </div>

                            <div class="col-md-12">
                                <label class="small fw-bold mb-2 text-main">Security Password </label>
                                <input type="password" name="password" class="form-control input-glass" placeholder="Enter Password" autocomplete="new-password" minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-glow-register w-100 mt-4 py-3">
                            Register Into Matrix &rarr;
                        </button>
                    </form>

                    <div class="text-center mt-4 text-muted small">
                        Already registered? <a href="/student-login" class="brand-accent text-decoration-none ms-1">Login here</a>
                    </div>
                </div>

            </div>
        </div>
    </div>
{% endblock %}
